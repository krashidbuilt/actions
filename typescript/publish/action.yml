name: "TypeScript Publish"
description: "Builds and publishes an npm package using bun publish"
inputs:
  working_directory:
    description: "Working directory containing the package to publish"
    default: "."
  tag:
    description: "npm dist-tag (alpha, beta, or latest)"
    required: true
  skip_build:
    description: "Skip running build before publish"
    default: "false"
  use_oidc:
    description: "Publish with npm trusted publishing (OIDC). Set false for a registry that has no OIDC token exchange — the Gitea package registry — to publish with the token typescript/setup wrote into .npmrc"
    default: "true"
outputs:
  published:
    description: "Whether the package was published"
  version:
    description: "Published version"
  tag:
    description: "NPM tag used"
runs:
  using: "node24"
  main: "dist/index.js"
