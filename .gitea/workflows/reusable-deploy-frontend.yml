name: Reusable Deploy Frontend

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      build_directory:
        type: string
        default: "dist"
      version_directory:
        description: "Directory containing package.json for version seed (defaults to working_directory)"
        type: string
        default: ""
      environment:
        description: "Target environment (auto-detected from branch if not set)"
        type: string
        default: ""
      domain:
        description: "Domain for bucket resolution (defaults to krashidbuilt.com)"
        type: string
        default: ""
      app_name:
        description: "Application name (auto-detected from package.json if not set)"
        type: string
        default: ""
      aws_region:
        type: string
        default: "us-east-1"
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      package_manager:
        type: string
        default: "auto"
      build_command:
        description: "Build command to run (default: build)"
        type: string
        default: "build"
      run_verify:
        type: boolean
        default: false
      run_tests:
        type: boolean
        default: false
      invalidate_cache:
        type: boolean
        default: true
      create_release:
        type: boolean
        default: true
      version_sync_command:
        description: "Command to sync version across packages (receives VERSION env var)"
        type: string
        default: ""
      commit_versions:
        description: "Commit and push version file changes after deploy"
        type: boolean
        default: false
      promote_from:
        description: "Promote version by replacing this prerelease identifier"
        type: string
        default: ""

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || inputs.aws_region }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: https://git.dsm.krashidbuilt.com/krashidbuilt/actions/actions/typescript/setup@bk/gitea-actions-mirror
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
      - uses: https://git.dsm.krashidbuilt.com/krashidbuilt/actions/actions/typescript/install-dependencies@bk/gitea-actions-mirror
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Verify
        if: inputs.run_verify
        uses: https://git.dsm.krashidbuilt.com/krashidbuilt/actions/actions/typescript/verify@bk/gitea-actions-mirror
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
          run_build: false
          run_tests: ${{ inputs.run_tests }}
      - uses: https://git.dsm.krashidbuilt.com/krashidbuilt/actions/actions/versioning@bk/gitea-actions-mirror
        id: version
        with:
          working_directory: ${{ inputs.version_directory || inputs.working_directory }}
          github_token: ${{ github.token }}
          create_release: ${{ inputs.create_release }}
          update_version_file: false
          release_prerelease: ${{ github.ref_name != 'production' }}
          prerelease_identifier: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || '' }}
          promote_from: ${{ inputs.promote_from }}
      - name: Sync versions
        if: steps.version.outputs.skipped != 'true' && inputs.version_sync_command != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ${{ inputs.version_sync_command }}
      - name: Build
        if: steps.version.outputs.skipped != 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: bun run ${{ inputs.build_command }}
      - uses: https://git.dsm.krashidbuilt.com/krashidbuilt/actions/actions/deploy/frontend@bk/gitea-actions-mirror
        if: steps.version.outputs.skipped != 'true'
        with:
          working_directory: ${{ inputs.working_directory }}
          build_directory: ${{ inputs.build_directory }}
          environment: ${{ inputs.environment }}
          domain: ${{ inputs.domain }}
          app_name: ${{ inputs.app_name }}
          version: ${{ steps.version.outputs.version }}
          aws_region: ${{ inputs.aws_region }}
          github_token: ${{ github.token }}
          invalidate_cache: ${{ inputs.invalidate_cache }}
      - name: Commit version changes
        if: steps.version.outputs.skipped != 'true' && inputs.commit_versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD
