name: Reusable Deploy Backend (CDK)

# Deploys an app repo's backend stack via CDK. Two auth paths, both starting
# from the caller's gitea-actions deployer-user static keys:
#   - role_arn empty (default): the static keys are used directly, as before.
#     That user holds a `CdkDeployAccess` policy (cloudformation:*, iam
#     role-management + PassRole, sts:AssumeRole) and the account's `cdk-*`
#     bootstrap roles trust the account root, so it can drive a full
#     `cdk deploy` with no role assumption.
#   - role_arn set (e.g. the account's `deploy-app` role): utilities/configure-aws
#     signs an STS AssumeRole with the static key and exports the role's
#     short-lived session; the deploy runs as that role.
# The keys are handed to the configure-aws step only (step env, not job env),
# so later steps see exactly what configure-aws exported to GITHUB_ENV.
# Pass app-specific CDK context (e.g. certificateArn) via `cdk_context`;
# `channel=<env>` is always injected.
on:
  workflow_call:
    inputs:
      slack_channel:
        description: "Slack channel (name or id) for the deploy card. Empty = vars.SLACK_DEPLOY_CHANNEL, then 'deployments'. No SLACK_BOT_TOKEN secret = no card."
        type: string
        default: ""
      slack_production_channel:
        description: "Slack channel for production cards. Empty = vars.SLACK_PRODUCTION_CHANNEL, then slack_channel."
        type: string
        default: ""
      working_directory:
        description: "Directory with package.json + CDK deps; build runs here"
        type: string
        default: "api"
      infra_directory:
        description: "Directory containing cdk.json (the CDK app)"
        type: string
        default: "api/infra"
      stack_name:
        description: "CDK stack to deploy. The token {ENV} is replaced with the PascalCase environment (Alpha/Beta/Production)."
        type: string
        required: true
      cdk_context:
        description: "Extra `--context key=value` pairs, one per line. `channel=<env>` is always injected automatically."
        type: string
        default: ""
      build_command:
        type: string
        default: "build"
      environment:
        description: "Target environment override (auto-detected from branch if empty)"
        type: string
        default: ""
      aws_region:
        type: string
        default: "us-east-1"
      role_arn:
        description: "Full IAM role ARN to assume with the static key (e.g. arn:aws:iam::<account>:role/deploy-app). Empty = deploy with the static key directly, as before."
        type: string
        default: ""
      cdk_version:
        description: "aws-cdk CLI version to run via bunx"
        type: string
        default: "2"
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      package_manager:
        type: string
        default: "auto"
      run_verify:
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    # No AWS keys at job level: they go to the Configure AWS step only.
    env:
      AWS_REGION: ${{ vars.AWS_REGION || inputs.aws_region }}
    steps:
      - uses: actions/checkout@v4
      - uses: krashidbuilt/actions/typescript/setup@v1
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-
      - uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Detect environment
        id: env
        uses: krashidbuilt/actions/utilities/detect-environment@v1
        with:
          environment: ${{ inputs.environment }}
      # deploy/frontend shells out to `aws`. Runner hosts cache different builds of
      # runner-images:ubuntu-latest and newer ones dropped the AWS CLI (2026-10-14: the
      # same deploy passed on `nas` and failed on another runner with "Unable to locate
      # executable file: aws"). Install it when missing.
      # (Here the CDK deploy runs via bunx and needs no AWS CLI; the Who am I step does.)
      - name: Ensure AWS CLI
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then aws --version; exit 0; fi
          arch=$(uname -m)
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${arch}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/awscli 2>/dev/null || python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws /tmp/awscli/aws/dist/aws_completer 2>/dev/null || true
          if [ "$(id -u)" = 0 ]; then /tmp/awscli/aws/install --update; else sudo /tmp/awscli/aws/install --update; fi
          aws --version
      # The keys are handed to the configure-aws step only (step env, not job env),
      # so later steps see exactly what configure-aws exported to GITHUB_ENV: the
      # assumed-role session when role_arn is set, the static keys unchanged otherwise.
      - name: Configure AWS
        uses: krashidbuilt/actions/utilities/configure-aws@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          environment: ${{ steps.env.outputs.environment }}
          role_arn: ${{ inputs.role_arn }}
          aws_region: ${{ vars.AWS_REGION || inputs.aws_region }}
      # Logs the identity later steps deploy as: the deployer user, or the
      # assumed-role session when role_arn is set (fails if the role didn't take).
      - name: Who am I
        shell: bash
        env:
          ROLE_ARN: ${{ inputs.role_arn }}
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "Deploying as: $arn"
          if [ -n "$ROLE_ARN" ] && [[ "$arn" != *":assumed-role/"* ]]; then
            echo "::error::role_arn is set ($ROLE_ARN) but the active identity is not an assumed-role session"
            exit 1
          fi
      # Slack deploy card: posted as PENDING here, updated in place by the
      # `if: always()` step at the end of the job. Without SLACK_BOT_TOKEN both
      # steps are no-ops, and a Slack failure only warns (never fails the deploy).
      - name: Slack (deploying)
        id: slack
        if: steps.env.outputs.environment != ''
        uses: krashidbuilt/actions/utilities/slack-notify@v1
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack_channel || vars.SLACK_DEPLOY_CHANNEL || 'deployments' }}
          production_channel: ${{ inputs.slack_production_channel || vars.SLACK_PRODUCTION_CHANNEL }}
          environment: ${{ steps.env.outputs.environment }}
      - name: Verify
        if: inputs.run_verify
        uses: krashidbuilt/actions/typescript/verify@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
          run_build: false
      - name: Build
        working-directory: ${{ inputs.working_directory }}
        run: bun run ${{ inputs.build_command }}
      - name: CDK deploy
        working-directory: ${{ inputs.infra_directory }}
        # No env var here may start with CDK_: the aws-cdk CLI parses yargs with
        # `.env('CDK')`, so CDK_CONTEXT would become --context and CDK_VERSION --version.
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          STACK_TEMPLATE: ${{ inputs.stack_name }}
          CONTEXT_LINES: ${{ inputs.cdk_context }}
          CLI_VERSION: ${{ inputs.cdk_version }}
        run: |
          set -euo pipefail
          env="$ENVIRONMENT"
          # PascalCase the environment for the {ENV} stack-name token.
          pascal="$(printf '%s' "${env:0:1}" | tr '[:lower:]' '[:upper:]')${env:1}"
          stack="${STACK_TEMPLATE//\{ENV\}/$pascal}"

          # Build --context args: always channel=<env>, plus any caller lines.
          context_args=( --context "channel=$env" )
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            context_args+=( --context "$line" )
          done <<< "$CONTEXT_LINES"

          echo "Deploying stack '$stack' (env=$env) with: ${context_args[*]}"
          bunx "aws-cdk@${CLI_VERSION}" deploy "$stack" \
            "${context_args[@]}" \
            --require-approval never \
            --no-rollback
      - name: Slack (result)
        if: always()
        uses: krashidbuilt/actions/utilities/slack-notify@v1
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack_channel || vars.SLACK_DEPLOY_CHANNEL || 'deployments' }}
          production_channel: ${{ inputs.slack_production_channel || vars.SLACK_PRODUCTION_CHANNEL }}
          status: ${{ job.status }}
          channel_id: ${{ steps.slack.outputs.channel_id }}
          message_id: ${{ steps.slack.outputs.message_id }}
          environment: ${{ steps.env.outputs.environment }}
