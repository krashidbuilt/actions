name: Reusable Deploy Frontend

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      build_directory:
        type: string
        default: "dist"
      version_directory:
        description: "Directory containing package.json for version seed (defaults to working_directory)"
        type: string
        default: ""
      environment:
        description: "Target environment (auto-detected from branch if not set)"
        type: string
        default: ""
      domain:
        description: "Domain for bucket resolution (defaults to krashidbuilt.com)"
        type: string
        default: ""
      app_name:
        description: "Application name (auto-detected from package.json if not set)"
        type: string
        default: ""
      aws_region:
        type: string
        default: "us-east-1"
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      package_manager:
        type: string
        default: "auto"
      build_command:
        description: "Build command to run (default: build)"
        type: string
        default: "build"
      run_verify:
        type: boolean
        default: false
      run_tests:
        type: boolean
        default: false
      invalidate_cache:
        type: boolean
        default: true
      create_release:
        type: boolean
        default: true
      version_sync_command:
        description: "Command to sync version across packages (receives VERSION env var)"
        type: string
        default: ""
      commit_versions:
        description: "Commit and push version file changes after deploy"
        type: boolean
        default: false
      promote_from:
        description: "Promote version by replacing this prerelease identifier"
        type: string
        default: ""

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || inputs.aws_region }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: krashidbuilt/actions/typescript/setup@v1
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
      # Cache bun's package store keyed on the lockfile hash. With the
      # gitea-runner persistent volume (config.yaml -> container.options),
      # this is mostly belt-and-suspenders — the volume already carries
      # the cache between runs. actions/cache still helps when the volume
      # is fresh (new NAS, runner rebuild) and across runner host moves.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-
      - uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Verify
        if: inputs.run_verify
        uses: krashidbuilt/actions/typescript/verify@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
          run_build: false
          run_tests: ${{ inputs.run_tests }}
      - uses: krashidbuilt/actions/versioning@v1
        id: version
        with:
          working_directory: ${{ inputs.version_directory || inputs.working_directory }}
          github_token: ${{ github.token }}
          create_release: ${{ inputs.create_release }}
          update_version_file: false
          release_prerelease: ${{ github.ref_name != 'production' }}
          prerelease_identifier: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || '' }}
          promote_from: ${{ inputs.promote_from }}
      - name: Sync versions
        if: steps.version.outputs.skipped != 'true' && inputs.version_sync_command != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ${{ inputs.version_sync_command }}
      - name: Build
        if: steps.version.outputs.skipped != 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: bun run ${{ inputs.build_command }}
      # deploy/frontend shells out to `aws`. Runner hosts cache different builds of
      # runner-images:ubuntu-latest and newer ones dropped the AWS CLI (2026-10-14: the
      # same deploy passed on `nas` and failed on another runner with "Unable to locate
      # executable file: aws"). Install it when missing.
      - name: Ensure AWS CLI
        if: steps.version.outputs.skipped != 'true'
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then aws --version; exit 0; fi
          arch=$(uname -m)
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${arch}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/awscli 2>/dev/null || python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws /tmp/awscli/aws/dist/aws_completer 2>/dev/null || true
          if [ "$(id -u)" = 0 ]; then /tmp/awscli/aws/install --update; else sudo /tmp/awscli/aws/install --update; fi
          aws --version
      - uses: krashidbuilt/actions/deploy/frontend@v1
        if: steps.version.outputs.skipped != 'true'
        with:
          working_directory: ${{ inputs.working_directory }}
          build_directory: ${{ inputs.build_directory }}
          environment: ${{ inputs.environment }}
          domain: ${{ inputs.domain }}
          app_name: ${{ inputs.app_name }}
          version: ${{ steps.version.outputs.version }}
          aws_region: ${{ inputs.aws_region }}
          github_token: ${{ github.token }}
          invalidate_cache: ${{ inputs.invalidate_cache }}
      - name: Commit version changes
        # `inputs.commit_versions == true` form (instead of bare
        # `inputs.commit_versions`) — act_runner v0.2.13 evaluates the
        # boolean default `false` to the string "false" which is then
        # truthy in `if:` context, running the step on every deploy.
        if: steps.version.outputs.skipped != 'true' && inputs.commit_versions == true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD
