name: Release

on:
  push:
    branches: [production]
    tags: ["v*.*.*"]

jobs:
  create-tag:
    name: Create Version Tag
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump patch, create tag, and update floating major tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git tag --list 'v1.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            PATCH="${LATEST##*.}"
            PREFIX="${LATEST%.*}"
            NEXT="${PREFIX}.$((PATCH + 1))"
          fi
          MAJOR="${NEXT%%.*}"
          echo "Latest: ${LATEST:-none}, Next: ${NEXT}, Major: ${MAJOR}"
          git tag "$NEXT"
          git tag -f "$MAJOR" "$NEXT"
          git push origin "$NEXT"
          git push origin "$MAJOR" --force

  clear-runner-action-cache:
    name: Clear stale action cache (${{ matrix.host }})
    # act caches a remote action by REF NAME and never re-fetches when a
    # floating tag moves, so every runner keeps serving whatever it cloned the
    # first time it saw krashidbuilt/actions@v1. Two promotes on 2026-09-23
    # moved v1 on the server and changed nothing the runners executed: googlecli
    # kept publishing with pre-fix setup code, and countertop-quote's deploy had
    # been running v1.0.9 actions for the same reason. Clearing the cache here
    # is what makes moving the tag mean something.
    #
    # Runs on the HOST runners, not the container ones: the cache lives in the
    # runner process's $HOME on the Mac, and a job inside a docker container
    # cannot see it. The linux runners share their Mac's cache, so clearing the
    # host clears both.
    #
    # Verified on 2026-09-23: all four legs ran and reported success. (A brief
    # detour replaced this with four explicit jobs after /actions/jobs appeared
    # to show the matrix job missing — that endpoint does not return newest
    # first, so the "missing" jobs were June's. /actions/tasks is the one that
    # answers "what just ran".)
    needs: create-tag
    if: github.ref_name == 'production'
    # A machine that is asleep or offline must not hold up a release, and a
    # failure here costs a stale cache, not a bad release.
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every runner that executes jobs on a host filesystem. The NAS runs
        # countertop-quote deploys, so it holds a cache of this repo too.
        host: [studio-host, mbp2024-host, self-hosted]
    runs-on: ${{ matrix.host }}
    steps:
      - name: Drop cached copies of this repo
        run: |
          CACHE="${HOME}/.cache/act"
          if [ ! -d "$CACHE" ]; then
            echo "no act cache at $CACHE"
            exit 0
          fi
          removed=0
          for d in "$CACHE"/*/; do
            d="${d%/}"
            [ -d "$d/.git" ] || continue
            url="$(git -C "$d" config --get remote.origin.url 2>/dev/null || true)"
            case "$url" in
              *krashidbuilt/actions*)
                sha="$(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo unknown)"
                rm -rf "$d"
                echo "cleared $(basename "$d") (was $sha)"
                removed=$((removed + 1))
                ;;
            esac
          done
          echo "cleared $removed cached copies of krashidbuilt/actions on ${{ matrix.host }}"

  update-major-tag:
    name: Update Major Version Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update floating major version tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          echo "Updating ${MAJOR} to point to ${TAG}"
          git tag -f "${MAJOR}" "${TAG}"
          git push origin "${MAJOR}" --force
