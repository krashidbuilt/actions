name: Release

on:
  push:
    branches: [production]
    tags: ["v*.*.*"]

jobs:
  create-tag:
    name: Create Version Tag
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump patch, create tag, and update floating major tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git tag --list 'v1.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            PATCH="${LATEST##*.}"
            PREFIX="${LATEST%.*}"
            NEXT="${PREFIX}.$((PATCH + 1))"
          fi
          MAJOR="${NEXT%%.*}"
          echo "Latest: ${LATEST:-none}, Next: ${NEXT}, Major: ${MAJOR}"
          git tag "$NEXT"
          git tag -f "$MAJOR" "$NEXT"
          git push origin "$NEXT"
          git push origin "$MAJOR" --force

  update-major-tag:
    name: Update Major Version Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update floating major version tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          echo "Updating ${MAJOR} to point to ${TAG}"
          git tag -f "${MAJOR}" "${TAG}"
          git push origin "${MAJOR}" --force
