name: Release

on:
  push:
    branches: [production]
    tags: ["v*.*.*"]

jobs:
  create-tag:
    name: Create Version Tag
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump patch, create tag, and update floating major tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git tag --list 'v1.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            PATCH="${LATEST##*.}"
            PREFIX="${LATEST%.*}"
            NEXT="${PREFIX}.$((PATCH + 1))"
          fi
          MAJOR="${NEXT%%.*}"
          echo "Latest: ${LATEST:-none}, Next: ${NEXT}, Major: ${MAJOR}"
          git tag "$NEXT"
          git tag -f "$MAJOR" "$NEXT"
          git push origin "$NEXT"
          git push origin "$MAJOR" --force

  # act caches a remote action by REF NAME and never re-fetches when a floating
  # tag moves, so a runner keeps serving whatever it cloned the first time it saw
  # krashidbuilt/actions@v1. On 2026-09-23 two promotes moved v1 on the server
  # and changed nothing the runners executed: googlecli published with pre-fix
  # setup code, and countertop-quote had been deploying v1.0.9 actions. Clearing
  # the cache after the tag move is what makes moving the tag mean something.
  #
  # One job per runner rather than a matrix: run 495 shipped this as a matrix
  # over `runs-on: ${{ matrix.host }}` and Gitea never scheduled the job at all —
  # it resolves runs-on labels before expanding the matrix, so the job vanished
  # silently rather than failing. Static labels are the only form that schedules.
  #
  # These run on the HOST runners because the cache lives in the runner process's
  # $HOME; a job inside a container cannot see it, and the linux runners share
  # their Mac's cache. continue-on-error everywhere: a sleeping machine costs a
  # stale cache, not a failed release.
  clear-cache-studio:
    name: Clear stale action cache (Mac Studio)
    needs: create-tag
    if: github.ref_name == 'production'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: studio-host
    steps:
      - name: Drop cached copies of this repo
        run: |
          CACHE="${HOME}/.cache/act"
          if [ ! -d "$CACHE" ]; then
            echo "no act cache at $CACHE"
            exit 0
          fi
          removed=0
          for d in "$CACHE"/*/; do
            d="${d%/}"
            [ -d "$d/.git" ] || continue
            url="$(git -C "$d" config --get remote.origin.url 2>/dev/null || true)"
            case "$url" in
              *krashidbuilt/actions*)
                sha="$(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo unknown)"
                rm -rf "$d"
                echo "cleared $(basename "$d") (was $sha)"
                removed=$((removed + 1))
                ;;
            esac
          done
          echo "cleared $removed cached copies of krashidbuilt/actions"

  clear-cache-mbp2023:
    name: Clear stale action cache (Bjorn's MBP 2023)
    needs: create-tag
    if: github.ref_name == 'production'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: mbp2023-host
    steps:
      - name: Drop cached copies of this repo
        run: |
          CACHE="${HOME}/.cache/act"
          if [ ! -d "$CACHE" ]; then
            echo "no act cache at $CACHE"
            exit 0
          fi
          removed=0
          for d in "$CACHE"/*/; do
            d="${d%/}"
            [ -d "$d/.git" ] || continue
            url="$(git -C "$d" config --get remote.origin.url 2>/dev/null || true)"
            case "$url" in
              *krashidbuilt/actions*)
                sha="$(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo unknown)"
                rm -rf "$d"
                echo "cleared $(basename "$d") (was $sha)"
                removed=$((removed + 1))
                ;;
            esac
          done
          echo "cleared $removed cached copies of krashidbuilt/actions"

  clear-cache-mbp2024:
    name: Clear stale action cache (Ben's MBP 2024)
    needs: create-tag
    if: github.ref_name == 'production'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: mbp2024-host
    steps:
      - name: Drop cached copies of this repo
        run: |
          CACHE="${HOME}/.cache/act"
          if [ ! -d "$CACHE" ]; then
            echo "no act cache at $CACHE"
            exit 0
          fi
          removed=0
          for d in "$CACHE"/*/; do
            d="${d%/}"
            [ -d "$d/.git" ] || continue
            url="$(git -C "$d" config --get remote.origin.url 2>/dev/null || true)"
            case "$url" in
              *krashidbuilt/actions*)
                sha="$(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo unknown)"
                rm -rf "$d"
                echo "cleared $(basename "$d") (was $sha)"
                removed=$((removed + 1))
                ;;
            esac
          done
          echo "cleared $removed cached copies of krashidbuilt/actions"

  clear-cache-nas:
    name: Clear stale action cache (NAS)
    needs: create-tag
    if: github.ref_name == 'production'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: self-hosted
    steps:
      - name: Drop cached copies of this repo
        run: |
          CACHE="${HOME}/.cache/act"
          if [ ! -d "$CACHE" ]; then
            echo "no act cache at $CACHE"
            exit 0
          fi
          removed=0
          for d in "$CACHE"/*/; do
            d="${d%/}"
            [ -d "$d/.git" ] || continue
            url="$(git -C "$d" config --get remote.origin.url 2>/dev/null || true)"
            case "$url" in
              *krashidbuilt/actions*)
                sha="$(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo unknown)"
                rm -rf "$d"
                echo "cleared $(basename "$d") (was $sha)"
                removed=$((removed + 1))
                ;;
            esac
          done
          echo "cleared $removed cached copies of krashidbuilt/actions"

  update-major-tag:
    name: Update Major Version Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update floating major version tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"
          echo "Updating ${MAJOR} to point to ${TAG}"
          git tag -f "${MAJOR}" "${TAG}"
          git push origin "${MAJOR}" --force
