name: Reusable CDK Deploy

# Runs `cdk diff` or `cdk deploy` for one CDK app in the caller repo (an infra
# repo like krashidbuilt/infrastructure: `bun bin/platform.ts`). PRs run
# `mode: diff`, which posts the diff as a PR comment and never fails because
# stacks differ. A merge runs `mode: deploy` (`--all` unless `stacks` names
# some), `--require-approval never`, `--concurrency <n>`.
#
# Auth goes through utilities/configure-aws, which picks one of three paths:
#   1. deployer key + role (Gitea canonical): the caller's org secrets
#      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (`secrets: inherit`) sign an
#      STS AssumeRole into `role_arn`, or `arn:aws:iam::<aws_account_id>:role/deploy-<role_scope>`
#      (e.g. role_scope `infra` → deploy-infra).
#   2. static-only: keys present, no role asked for → the keys are used as-is.
#   3. OIDC (GitHub only): no keys + a role → AssumeRoleWithWebIdentity. The
#      caller must grant `id-token: write`.
# The keys are handed to the configure-aws step only (step env, not job env),
# so later steps see exactly what configure-aws exported to GITHUB_ENV: the
# assumed-role session when a role was asked for, the static keys otherwise.
#
# Unlike reusable-deploy-backend, `--no-rollback` stays off: a failed infra
# stack rolls back to its last good state. A mid-run failure leaves the stacks
# that already finished updated and the rest untouched; they're independent,
# so a rerun finishes the job.
on:
  workflow_call:
    inputs:
      app:
        description: "CDK app command, passed as `--app \"<app>\"` (e.g. `bun bin/platform.ts`)"
        type: string
        required: true
      mode:
        description: "`diff` (print + PR comment, never fails on differences) or `deploy`"
        type: string
        required: true
      aws_account_id:
        description: "Account to deploy into. With role_scope, configure-aws assumes arn:aws:iam::<account>:role/deploy-<scope>. Also names the concurrency group cdk-<account>."
        type: string
        default: ""
      role_scope:
        description: "Role scope (`infra` → deploy-infra, `app` → deploy-app), combined with aws_account_id"
        type: string
        default: ""
      role_arn:
        description: "Full role ARN, passed through unchanged; wins over aws_account_id + role_scope. Empty + no account/scope = static keys only."
        type: string
        default: ""
      environment:
        description: "Passed to configure-aws, which requires alpha|beta|production. It only names the STS session (gitea-actions-<env>) and the log line; it does not pick an account, role or CDK context."
        type: string
        default: "production"
      context:
        description: "CDK context, one `key=value` per line, each passed as `--context key=value`"
        type: string
        default: ""
      stacks:
        description: "Whitespace-separated stack ids. Empty = `--all`."
        type: string
        default: ""
      concurrency:
        description: "Stacks deployed in parallel (`cdk deploy --concurrency <n>`; the CLI default is 1). Deploy mode only."
        type: number
        default: 4
      aws_region:
        type: string
        default: "us-east-1"
      working_directory:
        description: "Directory with package.json + cdk.json; install and cdk run here"
        type: string
        default: "."
      verify_command:
        description: "Optional command run in working_directory before diff/deploy (e.g. `bun run verify`). Empty = skip."
        type: string
        default: ""
      cdk_version:
        description: "aws-cdk CLI version to run via bunx"
        type: string
        default: "2"
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      package_manager:
        type: string
        default: "auto"
    outputs:
      mode:
        description: "The mode that ran (diff | deploy)"
        value: ${{ jobs.cdk.outputs.mode }}
      diff_comment_url:
        description: "URL of the PR comment holding the diff; empty when none was posted"
        value: ${{ jobs.cdk.outputs.diff_comment_url }}

jobs:
  cdk:
    name: CDK ${{ inputs.mode }}
    runs-on: ubuntu-latest
    # Deploys serialize per account in `cdk-<account>`. Gitea scopes concurrency
    # groups per repository, so this serializes runs of the calling repo only.
    # Diffs get their own group per ref: Gitea cancels a run already WAITING in
    # a group when a third arrives (even with cancel-in-progress: false), and a
    # PR diff must never cancel a queued deploy.
    concurrency:
      group: ${{ inputs.mode == 'deploy' && format('cdk-{0}', inputs.aws_account_id || 'default') || format('cdk-diff-{0}-{1}', inputs.aws_account_id || 'default', github.ref) }}
      cancel-in-progress: false
    outputs:
      mode: ${{ inputs.mode }}
      diff_comment_url: ${{ steps.comment.outputs.url }}
    steps:
      - name: Check inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          case "$MODE" in
            diff|deploy) ;;
            *) echo "::error::mode must be 'diff' or 'deploy', got '$MODE'"; exit 1 ;;
          esac
          if ! [[ "$CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::concurrency must be a positive integer, got '$CONCURRENCY'"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: krashidbuilt/actions/typescript/setup@v1
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-
      - uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Verify
        if: inputs.verify_command != ''
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          VERIFY_COMMAND: ${{ inputs.verify_command }}
        run: bash -euo pipefail -c "$VERIFY_COMMAND"
      - uses: krashidbuilt/actions/utilities/configure-aws@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          environment: ${{ inputs.environment }}
          role_arn: ${{ inputs.role_arn }}
          aws_account_id: ${{ inputs.aws_account_id }}
          role_scope: ${{ inputs.role_scope }}
          aws_region: ${{ inputs.aws_region }}
      # Runner hosts cache different builds of runner-images:ubuntu-latest and newer ones dropped
      # the AWS CLI (see reusable-deploy-frontend.yml). Install it when missing.
      - name: Ensure AWS CLI
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then aws --version; exit 0; fi
          arch=$(uname -m)
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${arch}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/awscli 2>/dev/null || python3 -m zipfile -e /tmp/awscliv2.zip /tmp/awscli
          chmod +x /tmp/awscli/aws/install /tmp/awscli/aws/dist/aws /tmp/awscli/aws/dist/aws_completer 2>/dev/null || true
          if [ "$(id -u)" = 0 ]; then /tmp/awscli/aws/install --update; else sudo /tmp/awscli/aws/install --update; fi
          aws --version
      # Shows the session CDK will run as (the assumed deploy-<scope> role, or the static user).
      - name: Who am I
        shell: bash
        run: aws sts get-caller-identity
      - name: CDK ${{ inputs.mode }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          APP: ${{ inputs.app }}
          STACKS: ${{ inputs.stacks }}
          CDK_CONTEXT: ${{ inputs.context }}
          CDK_VERSION: ${{ inputs.cdk_version }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          DIFF_FILE="$RUNNER_TEMP/cdk-diff.txt"

          read -ra stack_args <<< "$STACKS"
          [ "${#stack_args[@]}" -eq 0 ] && stack_args=( --all )

          context_args=()
          while IFS= read -r line; do
            line="${line%$'\r'}"
            line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            context_args+=( --context "$line" )
          done <<< "$CDK_CONTEXT"

          echo "cdk $MODE --app \"$APP\" ${stack_args[*]} ${context_args[*]}"
          if [ "$MODE" = diff ]; then
            # cdk diff writes to stderr. No --fail: differences are the point, not an error.
            # pipefail keeps a real failure (synth, auth) failing the step.
            bunx "aws-cdk@${CDK_VERSION}" diff --no-color --app "$APP" \
              "${stack_args[@]}" "${context_args[@]}" 2>&1 | tee "$DIFF_FILE"
          else
            # No --no-rollback here (backend deploys use it): a failed infra stack
            # should roll back to its last good state, not sit half-applied.
            bunx "aws-cdk@${CDK_VERSION}" deploy --app "$APP" \
              "${stack_args[@]}" "${context_args[@]}" \
              --require-approval never \
              --concurrency "$CONCURRENCY"
          fi
      - name: Post diff to PR
        id: comment
        if: inputs.mode == 'diff' && github.event.pull_request.number
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          DIFF_FILE="$RUNNER_TEMP/cdk-diff.txt"
          server="${GITHUB_SERVER_URL%/}"
          if [ -n "${GITHUB_API_URL:-}" ]; then api="${GITHUB_API_URL%/}"
          elif [ "$server" = https://github.com ]; then api=https://api.github.com
          else api="$server/api/v1"; fi
          run_url="$server/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Gitea comments hold far more, but keep the PR readable; the full diff is in the log.
          max=60000
          body_file="$RUNNER_TEMP/cdk-diff-comment.md"
          # shellcheck disable=SC2016 # backticks are markdown, not command substitution
          {
            printf '### cdk diff: `%s`\n\n' "$APP"
            printf 'Run [#%s](%s), commit `%s`.\n\n' "$GITHUB_RUN_NUMBER" "$run_url" "${GITHUB_SHA:0:7}"
            printf '<details><summary>Diff</summary>\n\n````\n'
            head -c "$max" "$DIFF_FILE"
            printf '\n````\n\n'
            if [ "$(wc -c < "$DIFF_FILE")" -gt "$max" ]; then
              printf '_Truncated at %s bytes, see the [run log](%s)._\n\n' "$max" "$run_url"
            fi
            printf '</details>\n'
          } > "$body_file"

          # A comment failure (e.g. a fork PR's read-only token) only warns: the diff is in the log.
          if response=$(jq -Rs '{body: .}' "$body_file" | curl -fsS -X POST \
              "$api/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-); then
            url=$(printf '%s' "$response" | jq -r '.html_url // empty')
            echo "Posted diff: $url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not post the diff to PR #$PR_NUMBER; it is in the log above."
          fi
