name: Reusable TypeScript Verify

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      run_tests:
        type: boolean
        default: false
      run_build:
        type: boolean
        default: true
      additional_install_directory:
        description: "Extra directory for bun install (e.g., webview-ui)"
        type: string
        default: ""
      package_manager:
        type: string
        default: "auto"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: krashidbuilt/actions/typescript/setup@v1
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
      - uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Install additional dependencies
        if: inputs.additional_install_directory != ''
        uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: "${{ inputs.working_directory }}/${{ inputs.additional_install_directory }}"
          package_manager: ${{ inputs.package_manager }}
      - uses: krashidbuilt/actions/typescript/verify@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
          run_build: ${{ inputs.run_build }}
          run_tests: ${{ inputs.run_tests }}
