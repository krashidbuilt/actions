name: Reusable Deploy Mobile

# Parameter-driven Expo/EAS mobile deploy. The CALLER decides what each branch
# (or workflow_dispatch input) means — this workflow has NO hardcoded branch
# names. Map branch → behavior in your own deploy.yml, e.g.:
#
#   with:
#     profile:                ${{ github.ref_name == 'production' && 'production' || 'preview' }}
#     auto_submit:            ${{ github.ref_name == 'production' && 'true' || 'false' }}
#     refresh_ad_hoc_profile: ${{ github.ref_name == 'production' && 'false' || 'true' }}
#     create_release:         ${{ github.ref_name == 'production' && 'true' || 'false' }}
#
# Boolean-ish inputs (auto_submit, refresh_ad_hoc_profile, create_release,
# run_verify, run_build) accept EITHER a string ('true'/'false', any case, or yes/on/1) OR a
# YAML boolean literal. They're declared `type: string` (the permissive type that
# sidesteps act_runner's `type: boolean` coercion bug) and run through a single
# Normalize step that canonicalizes them to 'true'/'false' — so every downstream
# `if:`/flag is immune to how the caller expressed the value. Unrecognized → false.
#
# Defaults are SAFE: an under-specified caller does a plain ad-hoc `preview`
# build with no store submit and no version bump — never an accidental release.
#
# Versioning only (no build): set `platforms: none` or `run_build: 'false'`
# together with `create_release: 'true'`. A caller uses that on its integration
# branch to tag + sync version files on every push, and builds from the
# promotion branches with `create_release: 'false'` — fifth-gear-tech-native-app
# versions on develop and builds a two-app matrix on staging/production.
#
# Secrets: EXPO_TOKEN (builds) and PUSH_TOKEN (optional) are declared under
# workflow_call.secrets. A caller in the same org/enterprise may use
# `secrets: inherit`; a caller in another org MUST pass them by name:
#     secrets:
#       EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
#
# EAS notes:
# - eas-cli via npx with EXPO_TOKEN in env (expo/expo-github-action isn't mirrored
#   on this Gitea instance). --no-wait: queues on EAS cloud and exits.
# - auto_submit needs submit.<profile>.ios.ascAppId in the caller's eas.json +
#   an ASC API key on the EAS account.
# - refresh_ad_hoc_profile (eas-cli >=19.1.0) registers newly-added devices
#   (eas device:create) on the Apple portal and refreshes the ad-hoc profile,
#   fully OTA, using the ASC API key stored in EAS. Use it for ad-hoc/internal
#   builds; leave off for store/production profiles (no device list).
# - EXPO_NO_CAPABILITY_SYNC=1 on both build steps: CI never mutates Apple
#   portal capabilities. eas-cli 24 syncs the app's entitlements (App Groups,
#   push, ...) to the bundle identifier before every iOS build, and on
#   2026-10-14 the fifth-gear-tech run died on Apple rejecting that APP_GROUPS
#   sync. Capabilities are enabled by hand in the portal once, during the
#   interactive `eas credentials -p ios` setup; a non-interactive build then
#   only signs. This is separate from --refresh-ad-hoc-provisioning-profile,
#   which still registers devices and regenerates the ad-hoc profile.
#
# build_runner: 'eas' (default) queues on EAS cloud and costs build credit.
# 'local' runs `eas build --local` on a self-hosted macOS runner instead: same
# build pipeline, same EAS-managed credentials, no build credit. It waits for
# the build, then (with auto_submit) uploads the artifact with `eas submit
# --path`, which is free either way. Both platforms build on that one macOS
# host: Android's aapt2/build-tools ship no linux-arm64 binaries, so the
# Studio's arm64 Linux runners cannot build it. The job's runner is
# `local_runner_label`:
#   - GitHub callers: the label of a self-hosted runner registered to the
#     calling repo (fifth-gear-tech-native-app: `fifth-gear-studio`). Callers
#     cannot set runs-on on a `uses:` job there; this input is how they pick it.
#   - Gitea callers: the default `studio-host`, AND `runs-on: studio-host` on
#     the calling job. On Gitea a uses-only job matches any runner, and the
#     runner that takes it runs this job, so the caller must route it.
# The host needs Xcode (DEVELOPER_DIR or xcode-select), CocoaPods, fastlane,
# JDK 17 and an Android SDK with the NDK the Expo SDK pins. The "Local build
# toolchain" step fills in the Studio's paths when the runner's env lacks them
# and fails fast, naming what is missing. Setup: hestia
# studio/services/github-runner-fifth-gear/README.md.

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: "24"
      eas_version:
        description: "eas-cli version for npx"
        type: string
        default: "latest"
      profile:
        description: "EAS build profile (e.g. preview, production)"
        type: string
        default: "preview"
      platforms:
        description: "Platforms to build (ios, android, all, none). none = versioning only, same as run_build 'false'"
        type: string
        default: "ios"
      auto_submit:
        description: "'true' to --auto-submit to the app store"
        type: string
        default: "false"
      refresh_ad_hoc_profile:
        description: "'true' to --refresh-ad-hoc-provisioning-profile (ad-hoc/internal iOS only)"
        type: string
        default: "false"
      create_release:
        description: "'true' to version-bump + tag + sync version files"
        type: string
        default: "false"
      run_verify:
        description: "'true' to run npm run verify before building"
        type: string
        default: "true"
      run_build:
        description: "'false' to skip both eas build steps (versioning only); platforms 'none' does the same"
        type: string
        default: "true"
      version_sync_command:
        description: "Command to write VERSION into version files. Receives VERSION env var. Used only when create_release is 'true'."
        type: string
        default: "npm pkg set version=$VERSION"
      build_runner:
        description: "'eas' (EAS cloud, costs build credit) or 'local' (eas build --local on a self-hosted macOS runner, no credit)"
        type: string
        default: "eas"
      local_runner_label:
        description: "runs-on label for build_runner 'local' (GitHub: the repo's self-hosted runner label; Gitea: studio-host)"
        type: string
        default: "studio-host"
    # Declared so a caller in ANOTHER organization can pass them by name. On
    # GitHub `secrets: inherit` only reaches a reusable in the same org or
    # enterprise: fifth-gear-tech's first staging run (2026-10-14) called this
    # from github.com/krashidbuilt/actions with `inherit` and eas-cli saw an
    # empty EXPO_TOKEN ("An Expo user account is required"). Same-org callers
    # (ETW on Gitea) can keep `secrets: inherit`; both forms satisfy these.
    secrets:
      EXPO_TOKEN:
        description: "Expo access token for eas-cli (required when a build step runs)"
        required: false
      PUSH_TOKEN:
        description: "Token that may push the version commit when github.token cannot (protected branch). Optional."
        required: false

jobs:
  deploy:
    name: Deploy Mobile
    # GitHub expression == ignores case, so 'Local' routes the same as 'local'.
    runs-on: ${{ inputs.build_runner == 'local' && inputs.local_runner_label || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      # Normalize the boolean-ish inputs to canonical 'true'/'false' ONCE, so the
      # rest of the workflow is immune to how the caller expressed them. Accepts
      # true/false in any case, plus yes/on/1 — and a YAML boolean literal, which
      # arrives here as the string "true"/"false" (inputs are type:string, the
      # permissive type that sidesteps act_runner's boolean coercion bug). Anything
      # unrecognized → false (safe). Downstream `if:` and flags read steps.norm.*.
      - name: Normalize inputs
        id: norm
        env:
          AUTO_SUBMIT: ${{ inputs.auto_submit }}
          REFRESH: ${{ inputs.refresh_ad_hoc_profile }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RUN_VERIFY: ${{ inputs.run_verify }}
          RUN_BUILD: ${{ inputs.run_build }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_RUNNER: ${{ inputs.build_runner }}
        run: |
          b() { case "$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]')" in true|yes|on|1) echo true;; *) echo false;; esac; }
          # Unlike the booleans, a typo here fails: runs-on already routed the
          # job on this value, and silently building on EAS would spend credit.
          BUILD_RUNNER_N="$(printf '%s' "${BUILD_RUNNER:-eas}" | tr '[:upper:]' '[:lower:]')"
          case "$BUILD_RUNNER_N" in
            eas|local) ;;
            *) echo "::error::build_runner must be 'eas' or 'local', got '$BUILD_RUNNER'"; exit 1;;
          esac
          # Which eas build steps run: run_build must be true AND platforms must
          # name the platform. platforms=none (or anything unknown) builds nothing.
          RUN_BUILD_N="$(b "$RUN_BUILD")"
          PLATFORMS_N="$(printf '%s' "${PLATFORMS:-}" | tr '[:upper:]' '[:lower:]')"
          BUILD_IOS=false; BUILD_ANDROID=false
          if [ "$RUN_BUILD_N" = "true" ]; then
            case "$PLATFORMS_N" in ios|all) BUILD_IOS=true;; esac
            case "$PLATFORMS_N" in android|all) BUILD_ANDROID=true;; esac
          fi
          echo "run_build=$RUN_BUILD_N platforms=$PLATFORMS_N runner=$BUILD_RUNNER_N -> ios=$BUILD_IOS android=$BUILD_ANDROID"
          {
            echo "build_runner=$BUILD_RUNNER_N"
            echo "auto_submit=$(b "$AUTO_SUBMIT")"
            echo "refresh=$(b "$REFRESH")"
            echo "create_release=$(b "$CREATE_RELEASE")"
            echo "run_verify=$(b "$RUN_VERIFY")"
            echo "run_build=$RUN_BUILD_N"
            echo "build_ios=$BUILD_IOS"
            echo "build_android=$BUILD_ANDROID"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Verify
        if: steps.norm.outputs.run_verify == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: npm run verify

      # Versioning (when create_release): tag-only; the sync command writes the
      # version into package.json AND app files, recorded in one [skip ci] commit.
      - uses: krashidbuilt/actions/versioning@v1
        id: version
        if: steps.norm.outputs.create_release == 'true'
        with:
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ github.token }}
          create_release: true
          update_version_file: false
          release_prerelease: false

      - name: Sync version files
        if: steps.norm.outputs.create_release == 'true' && steps.version.outputs.skipped != 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ${{ inputs.version_sync_command }}

      - name: Commit version changes
        if: steps.norm.outputs.create_release == 'true' && steps.version.outputs.skipped != 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD

      # Builds run unless run_build is false or platforms is none (versioning-only
      # callers). Flags assembled from inputs via shell (string-safe).
      - name: Build iOS
        if: steps.norm.outputs.build_ios == 'true' && steps.norm.outputs.build_runner == 'eas'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # CI never mutates Apple portal capabilities (see header). The
          # 2026-10-14 fifth-gear run died on Apple rejecting eas-cli 24's
          # APP_GROUPS sync; capabilities are enabled by hand, once, in the portal.
          EXPO_NO_CAPABILITY_SYNC: "1"
          EAS_VERSION: ${{ inputs.eas_version }}
          PROFILE: ${{ inputs.profile }}
          AUTO_SUBMIT: ${{ steps.norm.outputs.auto_submit }}
          REFRESH: ${{ steps.norm.outputs.refresh }}
        run: |
          SUBMIT=""; [ "$AUTO_SUBMIT" = "true" ] && SUBMIT="--auto-submit"
          REFRESH_FLAG=""; [ "$REFRESH" = "true" ] && REFRESH_FLAG="--refresh-ad-hoc-provisioning-profile"
          echo "Building iOS — profile=$PROFILE submit='${SUBMIT:-none}' refresh='${REFRESH_FLAG:-none}'"
          npx eas-cli@"$EAS_VERSION" build \
            --profile "$PROFILE" \
            --platform ios \
            $SUBMIT \
            $REFRESH_FLAG \
            --non-interactive \
            --no-wait

      - name: Build Android
        if: steps.norm.outputs.build_android == 'true' && steps.norm.outputs.build_runner == 'eas'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Same guard as iOS, kept on both steps so the policy is one setting.
          EXPO_NO_CAPABILITY_SYNC: "1"
          EAS_VERSION: ${{ inputs.eas_version }}
          PROFILE: ${{ inputs.profile }}
          AUTO_SUBMIT: ${{ steps.norm.outputs.auto_submit }}
        run: |
          SUBMIT=""; [ "$AUTO_SUBMIT" = "true" ] && SUBMIT="--auto-submit"
          echo "Building Android — profile=$PROFILE submit='${SUBMIT:-none}'"
          npx eas-cli@"$EAS_VERSION" build \
            --profile "$PROFILE" \
            --platform android \
            $SUBMIT \
            --non-interactive \
            --no-wait

      # --- build_runner: local -------------------------------------------------
      # `eas build --local` on this self-hosted macOS runner: the EAS build
      # pipeline, EAS-managed credentials, no build credit. It waits for the
      # build; the artifact goes to RUNNER_TEMP, outside the checkout.
      #
      # A LaunchAgent runner does not get a login shell, so the Studio's tool
      # paths are filled in here when the runner env lacks them, and anything
      # still missing fails the job before a 15-minute build gets to it.
      - name: Local build toolchain
        if: steps.norm.outputs.build_runner == 'local' && (steps.norm.outputs.build_ios == 'true' || steps.norm.outputs.build_android == 'true')
        env:
          BUILD_IOS: ${{ steps.norm.outputs.build_ios }}
          BUILD_ANDROID: ${{ steps.norm.outputs.build_android }}
        run: |
          missing=""
          add_env() { echo "$1=$2" >> "$GITHUB_ENV"; export "$1=$2"; echo "$1=$2"; }
          # CocoaPods and fastlane refuse a non-UTF-8 locale.
          [ -n "${LANG:-}" ] || add_env LANG en_US.UTF-8
          [ -n "${LC_ALL:-}" ] || add_env LC_ALL en_US.UTF-8
          if [ "$BUILD_IOS" = "true" ]; then
            # xcode-select may point at the Command Line Tools, which have no iOS SDK.
            if [ -z "${DEVELOPER_DIR:-}" ] && ! xcrun --sdk iphoneos --show-sdk-version >/dev/null 2>&1 \
               && [ -d /Applications/Xcode.app/Contents/Developer ]; then
              add_env DEVELOPER_DIR /Applications/Xcode.app/Contents/Developer
            fi
            xcrun --sdk iphoneos --show-sdk-version >/dev/null 2>&1 || missing="$missing Xcode-with-iOS-SDK"
            command -v pod >/dev/null || missing="$missing cocoapods"
            command -v fastlane >/dev/null || missing="$missing fastlane"
            # Xcode's IPA export runs /usr/bin/rsync (openrsync), which starts its
            # server side as the first `rsync` on PATH. Homebrew's rsync 3.x
            # rejects openrsync's flags ("--extended-attributes: unknown option")
            # and the export dies with "exportArchive Copy failed" after a good
            # archive: fifth-gear staging run 39518316890, 2026-10-21.
            if [ "$(command -v rsync)" != "/usr/bin/rsync" ]; then
              echo "rsync on PATH is $(command -v rsync); putting /usr/bin first for the iOS export"
              echo "/usr/bin" >> "$GITHUB_PATH"
            fi
          fi
          if [ "$BUILD_ANDROID" = "true" ]; then
            if [ -z "${JAVA_HOME:-}" ]; then
              for j in /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
                       "$(/usr/libexec/java_home -v 17 2>/dev/null || true)"; do
                [ -n "$j" ] && [ -x "$j/bin/java" ] && { add_env JAVA_HOME "$j"; break; }
              done
            fi
            [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/java" ] || missing="$missing JDK-17"
            if [ -z "${ANDROID_HOME:-}" ] && [ -d "$HOME/Library/Android/sdk" ]; then
              add_env ANDROID_HOME "$HOME/Library/Android/sdk"
            fi
            [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms" ] || missing="$missing Android-SDK"
            [ -n "${ANDROID_SDK_ROOT:-}" ] || [ -z "${ANDROID_HOME:-}" ] || add_env ANDROID_SDK_ROOT "$ANDROID_HOME"
          fi
          if [ -n "$missing" ]; then
            echo "::error::build_runner 'local' needs on $(hostname):$missing (hestia studio/services/github-runner-fifth-gear/README.md)"
            exit 1
          fi
          [ "$BUILD_IOS" = "true" ] && { xcodebuild -version | head -1; pod --version; }
          [ "$BUILD_ANDROID" = "true" ] && "$JAVA_HOME/bin/java" -version 2>&1 | head -1
          node --version

      - name: Build iOS (local)
        id: local_ios
        if: steps.norm.outputs.build_ios == 'true' && steps.norm.outputs.build_runner == 'local'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_CAPABILITY_SYNC: "1"
          EAS_VERSION: ${{ inputs.eas_version }}
          PROFILE: ${{ inputs.profile }}
          REFRESH: ${{ steps.norm.outputs.refresh }}
        run: |
          REFRESH_FLAG=""; [ "$REFRESH" = "true" ] && REFRESH_FLAG="--refresh-ad-hoc-provisioning-profile"
          OUT="$RUNNER_TEMP/$PROFILE-ios.ipa"
          rm -f "$OUT"
          echo "Building iOS locally — profile=$PROFILE refresh='${REFRESH_FLAG:-none}' -> $OUT"
          npx eas-cli@"$EAS_VERSION" build \
            --local \
            --profile "$PROFILE" \
            --platform ios \
            $REFRESH_FLAG \
            --non-interactive \
            --output "$OUT"
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"

      # --wait: the job's result is the store upload's result (Apple/Google
      # rejecting the binary fails here, not silently on expo.dev).
      - name: Submit iOS (local build)
        if: steps.local_ios.outcome == 'success' && steps.norm.outputs.auto_submit == 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_VERSION: ${{ inputs.eas_version }}
          PROFILE: ${{ inputs.profile }}
          ARTIFACT: ${{ steps.local_ios.outputs.artifact }}
        run: |
          npx eas-cli@"$EAS_VERSION" submit \
            --platform ios \
            --profile "$PROFILE" \
            --path "$ARTIFACT" \
            --wait \
            --non-interactive

      - name: Build Android (local)
        id: local_android
        if: steps.norm.outputs.build_android == 'true' && steps.norm.outputs.build_runner == 'local'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_CAPABILITY_SYNC: "1"
          EAS_VERSION: ${{ inputs.eas_version }}
          PROFILE: ${{ inputs.profile }}
        run: |
          # aab or apk is the profile's call (android.buildType, possibly on a
          # profile it extends), and eas submit reads the type from the file
          # extension. Build to a neutral name, then name it by its contents:
          # only an app bundle carries BundleConfig.pb.
          OUT="$RUNNER_TEMP/$PROFILE-android"
          rm -f "$OUT" "$OUT.aab" "$OUT.apk"
          echo "Building Android locally — profile=$PROFILE"
          npx eas-cli@"$EAS_VERSION" build \
            --local \
            --profile "$PROFILE" \
            --platform android \
            --non-interactive \
            --output "$OUT"
          if unzip -l "$OUT" | grep -q 'BundleConfig.pb'; then EXT=aab; else EXT=apk; fi
          mv "$OUT" "$OUT.$EXT"
          OUT="$OUT.$EXT"
          echo "built $OUT"
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"

      - name: Submit Android (local build)
        if: steps.local_android.outcome == 'success' && steps.norm.outputs.auto_submit == 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_VERSION: ${{ inputs.eas_version }}
          PROFILE: ${{ inputs.profile }}
          ARTIFACT: ${{ steps.local_android.outputs.artifact }}
        run: |
          npx eas-cli@"$EAS_VERSION" submit \
            --platform android \
            --profile "$PROFILE" \
            --path "$ARTIFACT" \
            --wait \
            --non-interactive
