name: Reusable Deploy Mobile

# Expo/EAS mobile app deploys (modeled on reusable-deploy-frontend).
#
# Branch-driven behavior (matches the org develop/staging/production convention,
# same spirit as reusable-deploy-frontend's branch-based prerelease IDs):
#   - staging    → `preview`    profile = ad-hoc / internal distribution, no
#                  store submit, no version bump. For on-device test installs.
#   - production → `production`  profile = App Store / TestFlight build, auto
#                  submit, version bump + tag + release.
#   - anything else → `preview`, no submit, no bump.
# An explicit `profile` input overrides the branch-derived profile.
#
# KEY DIFFERENCE from reusable-deploy-frontend: the EAS build ALWAYS runs. We do
# NOT gate it on a version bump — a staging→production promotion has no new
# commits since staging's work, so a skip-gated build would never ship to
# TestFlight. Only the version bump/commit is conditional (production + new
# commits since last tag).
#
# EAS notes:
# - eas-cli is invoked via npx with EXPO_TOKEN in env — expo/expo-github-action
#   is not mirrored on this Gitea instance.
# - --no-wait by default: the runner only queues the build on EAS cloud; build
#   status lives in the Expo dashboard, not this workflow run.
# - Auto-submit (production) requires submit.production.ios.ascAppId in the
#   consumer's eas.json plus an App Store Connect API key on the EAS account.
# - Ad-hoc (staging/preview) requires the ad-hoc distribution cert + provisioning
#   profile to already exist on EAS (first-time setup is interactive). Newly
#   registered devices are picked up automatically on the next build when an
#   ASC API key is configured on the EAS account.
#
# Branch comparisons use github.ref_name STRING equality throughout — never
# boolean inputs through `${{ }}` expressions, which act_runner v0.2.13 coerces
# to strings and silently mis-evaluates against `== true`.

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: "24"
      eas_version:
        description: "eas-cli version for npx"
        type: string
        default: "latest"
      profile:
        description: "EAS build profile override (empty = derive from branch)"
        type: string
        default: ""
      platforms:
        description: "Platforms to build (ios, android, all)"
        type: string
        default: "ios"
      run_verify:
        description: "Run npm run verify before building"
        type: boolean
        default: true
      version_sync_command:
        description: "Command to write VERSION into version files (package.json, app.json, ...). Receives VERSION env var. Production only."
        type: string
        default: "npm pkg set version=$VERSION"

jobs:
  deploy:
    name: Deploy Mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      # `inputs.x == true` form — act_runner v0.2.13 evaluates boolean defaults
      # to strings, truthy in a bare `if:`. Same workaround as the frontend reusable.
      - name: Verify
        if: inputs.run_verify == true
        working-directory: ${{ inputs.working_directory }}
        run: npm run verify

      # Versioning: PRODUCTION ONLY. Tag-only (update_version_file: false); the
      # sync command writes the version into package.json AND app.json, recorded
      # in one [skip ci] commit. Staging builds carry the current version as-is.
      - uses: krashidbuilt/actions/versioning@v1
        id: version
        if: github.ref_name == 'production'
        with:
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ github.token }}
          create_release: true
          update_version_file: false
          release_prerelease: false

      - name: Sync version files
        if: github.ref_name == 'production' && steps.version.outputs.skipped != 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ${{ inputs.version_sync_command }}

      - name: Commit version changes
        if: github.ref_name == 'production' && steps.version.outputs.skipped != 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD

      # Build ALWAYS runs (not gated on a version bump). Profile + submit flag
      # are derived from the branch via string comparison; an explicit profile
      # input wins. Production auto-submits to TestFlight; staging does not.
      # Ad-hoc (non-production) builds add --refresh-ad-hoc-provisioning-profile so
      # CI auto-registers any newly-added devices (from `eas device:create`) on the
      # Apple portal and refreshes the profile before building — fully OTA, no Mac.
      # Uses the ASC API key stored in EAS (the same one used for submissions);
      # no extra secrets needed. Requires eas-cli >= 19.1.0 (default 'latest' is
      # fine). The flag is omitted on production (App Store profiles have no device
      # list). See https://docs.expo.dev/build/internal-distribution/
      - name: Build iOS
        if: inputs.platforms == 'ios' || inputs.platforms == 'all'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ inputs.profile != '' && inputs.profile || (github.ref_name == 'production' && 'production' || 'preview') }}"
          SUBMIT="${{ github.ref_name == 'production' && '--auto-submit' || '' }}"
          REFRESH="${{ github.ref_name == 'production' && '' || '--refresh-ad-hoc-provisioning-profile' }}"
          echo "Building iOS — branch=${{ github.ref_name }} profile=$PROFILE submit='${SUBMIT:-none}' refresh='${REFRESH:-none}'"
          npx eas-cli@${{ inputs.eas_version }} build \
            --profile "$PROFILE" \
            --platform ios \
            $SUBMIT \
            $REFRESH \
            --non-interactive \
            --no-wait

      - name: Build Android
        if: inputs.platforms == 'android' || inputs.platforms == 'all'
        working-directory: ${{ inputs.working_directory }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ inputs.profile != '' && inputs.profile || (github.ref_name == 'production' && 'production' || 'preview') }}"
          SUBMIT="${{ github.ref_name == 'production' && '--auto-submit' || '' }}"
          echo "Building Android — branch=${{ github.ref_name }} profile=$PROFILE submit='${SUBMIT:-none}'"
          npx eas-cli@${{ inputs.eas_version }} build \
            --profile "$PROFILE" \
            --platform android \
            $SUBMIT \
            --non-interactive \
            --no-wait
