name: Reusable TypeScript Publish

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      package_manager:
        type: string
        default: "auto"
      run_verify:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      registry_scope:
        type: string
        default: "@krashidbuilt"
      registry_url:
        # Every @krashidbuilt package lives in the Gitea registry, so that is the
        # default — it matches registry_scope above. Publishing to npmjs.org is
        # the opt-in: set this to https://registry.npmjs.org/ and use_oidc: true.
        type: string
        default: "https://git.dsm.krashidbuilt.com/api/packages/krashidbuilt/npm/"
      use_oidc:
        # npmjs trusted publishing, which the Gitea registry has no token
        # exchange for. Defaults off to match registry_url; repos publishing to
        # npmjs.org turn it on and drop NPM_TOKEN.
        type: boolean
        default: false
      update_version_file:
        # Whether the repo carries a release commit. Off by default: publish
        # receives the computed version directly (see the version input below)
        # and writes it into package.json for the publish only, so nothing has
        # to be pushed back to the branch that triggered the run. Turn it on if
        # you want package.json in the repo to track releases.
        type: boolean
        default: false
      production_branch:
        # The branch whose releases are final rather than prereleases. Repos
        # that live on a single line (main) name it here.
        type: string
        default: "production"
      skip_build:
        # Source-only packages (bin points at .ts) have a build script that
        # compiles a standalone binary which never ships in the tarball —
        # airbnbcli and sagacli cannot even build theirs, because bun build
        # --compile will not bundle playwright's dynamic chromium-bidi requires.
        # This governs the verify step's build as well as publish's: if the
        # artifact is not published, CI has no reason to produce it.
        type: boolean
        default: false
      create_release:
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    name: Publish
    # With update_version_file: true the versioning step pushes its own
    # "chore(release): vX.Y.Z" commit, which lands on the same branch that
    # triggered this run. Without this guard that push re-triggers the workflow
    # and the repo releases itself in a loop.
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: krashidbuilt/actions/typescript/setup@v1
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
          registry_scope: ${{ inputs.registry_scope }}
          registry_url: ${{ inputs.registry_url }}
          registry_auth_token: ${{ secrets.NPM_TOKEN }}
      - uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Verify
        if: inputs.run_verify
        uses: krashidbuilt/actions/typescript/verify@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
          run_build: ${{ !inputs.skip_build }}
      - uses: krashidbuilt/actions/versioning@v1
        id: version
        with:
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ github.token }}
          create_release: ${{ inputs.create_release }}
          update_version_file: ${{ inputs.update_version_file }}
          release_prerelease: ${{ github.ref_name != inputs.production_branch }}
          prerelease_identifier: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || '' }}
      - uses: krashidbuilt/actions/typescript/publish@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          tag: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || 'latest' }}
          use_oidc: ${{ inputs.use_oidc }}
          skip_build: ${{ inputs.skip_build }}
          # The number the versioning step just computed. Without this, publish
          # would ship whatever package.json still says — the previous version
          # under the new tag — unless update_version_file pushed a commit first.
          version: ${{ steps.version.outputs.version }}
