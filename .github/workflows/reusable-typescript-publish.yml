name: Reusable TypeScript Publish

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: "24"
      bun_version:
        type: string
        default: "1.3.5"
      package_manager:
        type: string
        default: "auto"
      run_verify:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
      registry_scope:
        type: string
        default: "@krashidbuilt"
      registry_url:
        # Every @krashidbuilt package lives in the Gitea registry, so that is the
        # default — it matches registry_scope above. Publishing to npmjs.org is
        # the opt-in: set this to https://registry.npmjs.org/ and use_oidc: true.
        type: string
        default: "https://git.dsm.krashidbuilt.com/api/packages/krashidbuilt/npm/"
      use_oidc:
        # npmjs trusted publishing, which the Gitea registry has no token
        # exchange for. Defaults off to match registry_url; repos publishing to
        # npmjs.org turn it on and drop NPM_TOKEN.
        type: boolean
        default: false
      update_version_file:
        # Whether the repo carries a release commit. Off by default: publish
        # receives the computed version directly (see the version input below)
        # and writes it into package.json for the publish only, so nothing has
        # to be pushed back to the branch that triggered the run. Turn it on if
        # you want package.json in the repo to track releases.
        type: boolean
        default: false
      production_branch:
        # The branch whose releases are final rather than prereleases. Repos
        # that live on a single line (main) name it here.
        type: string
        default: "production"
      skip_build:
        # Source-only packages (bin points at .ts) have a build script that
        # compiles a standalone binary which never ships in the tarball —
        # airbnbcli and sagacli cannot even build theirs, because bun build
        # --compile will not bundle playwright's dynamic chromium-bidi requires.
        # This governs the verify step's build as well as publish's: if the
        # artifact is not published, CI has no reason to produce it.
        type: boolean
        default: false
      create_release:
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    name: Publish
    # With update_version_file: true the versioning step pushes its own
    # "chore(release): vX.Y.Z" commit, which lands on the same branch that
    # triggered this run. Without this guard that push re-triggers the workflow
    # and the repo releases itself in a loop.
    if: ${{ !startsWith(github.event.head_commit.message || '', 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: krashidbuilt/actions/typescript/setup@v1
        with:
          node_version: ${{ inputs.node_version }}
          bun_version: ${{ inputs.bun_version }}
          working_directory: ${{ inputs.working_directory }}
          registry_scope: ${{ inputs.registry_scope }}
          registry_url: ${{ inputs.registry_url }}
          registry_auth_token: ${{ secrets.NPM_TOKEN }}
      - uses: krashidbuilt/actions/typescript/install-dependencies@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
      - name: Verify
        if: inputs.run_verify
        uses: krashidbuilt/actions/typescript/verify@v1
        with:
          working_directory: ${{ inputs.working_directory }}
          package_manager: ${{ inputs.package_manager }}
          run_build: ${{ !inputs.skip_build }}
      # Versioning runs twice on purpose, and the split is the point.
      #
      # It used to run once, before publish, creating the tag and the release as
      # it computed the number. When publish then failed — an expired token, a
      # registry outage, a red build — the tag and the release survived and
      # advertised a version the registry never received. googlecli carried
      # v0.11.1 and v0.11.2-alpha.1 that way, and with update_version_file on at
      # the time, a chore(release) commit for the phantom version landed on main
      # permanently.
      #
      # So: compute the number with no side effects, publish, and only record
      # the release once the package is actually in the registry. The second
      # call recomputes the same number — the tag state and the commits it reads
      # are unchanged by publishing — and is where the tag, the release and the
      # optional version commit are made.
      - uses: krashidbuilt/actions/versioning@v1
        id: version
        with:
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ github.token }}
          create_tag: false
          create_release: false
          update_version_file: false
          release_prerelease: ${{ github.ref_name != inputs.production_branch }}
          prerelease_identifier: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || '' }}
      # An empty version means versioning found no bump-worthy commits since the
      # last tag, and there is nothing to release. Publishing anyway is not a
      # no-op: publish falls back to package.json, which on a repo that does not
      # carry release commits still holds the version BEFORE the last release —
      # so a re-run with no new commits republished sentrycli 0.1.0 over the top
      # of 0.1.1 and moved the latest dist-tag backwards.
      - uses: krashidbuilt/actions/typescript/publish@v1
        if: steps.version.outputs.version != ''
        with:
          working_directory: ${{ inputs.working_directory }}
          tag: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || 'latest' }}
          use_oidc: ${{ inputs.use_oidc }}
          skip_build: ${{ inputs.skip_build }}
          # The number computed above. Without this, publish would ship whatever
          # package.json still says — the previous version under the new tag.
          version: ${{ steps.version.outputs.version }}
      - name: Nothing to release
        if: steps.version.outputs.version == ''
        run: echo "No bump-worthy commits since the last tag — skipping publish."
      - name: Record the release
        uses: krashidbuilt/actions/versioning@v1
        if: steps.version.outputs.version != ''
        with:
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ github.token }}
          create_tag: true
          create_release: ${{ inputs.create_release }}
          update_version_file: ${{ inputs.update_version_file }}
          release_prerelease: ${{ github.ref_name != inputs.production_branch }}
          prerelease_identifier: ${{ github.ref_name == 'develop' && 'alpha' || github.ref_name == 'staging' && 'beta' || '' }}
